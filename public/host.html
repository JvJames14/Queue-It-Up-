<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Queue It Up!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a1a; --panel: #221c3a; --accent: #ff3d9a; --accent-2: #7c4dff;
    --text: #f7f4ff; --muted: #b3a9d6; --gold: #ffd94a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 15% -10%, rgba(255,61,154,0.25), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(124,77,255,0.28), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(255,217,74,0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }

  .tv-frame {
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    container-type: size;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 1.5cqh 2.5cqw;
  }
  .header-row {
    flex-shrink: 0; margin-top: 2.8cqh;
    display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 2cqw;
    transition: margin-top 0.2s ease;
  }
  .header-side { flex-shrink: 0; width: 15cqw; min-width: 190px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .header-center { flex: 1; text-align: center; }
  .mini-code-label { font-size: 1.8cqmin; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
  .mini-code { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 6.5cqmin; letter-spacing: 0.1em; color: var(--gold); }
  .tv-frame.video-focus:not(.cover-showing) .mini-code { font-size: 3.8cqmin; }
  #qrcode { background: #fff; padding: 4px; border-radius: 0.6cqmin; line-height: 0; }
  #qrcode img, #qrcode canvas { width: 180px !important; height: 180px !important; }
  .tv-frame.video-focus:not(.cover-showing) #qrcode img,
  .tv-frame.video-focus:not(.cover-showing) #qrcode canvas { width: 102px !important; height: 102px !important; }
  .qr-unavailable { font-size: 0.7cqmin; color: var(--muted); }
  #end-game-btn {
    position: fixed; bottom: 2cqh; right: 2cqw; z-index: 500;
    background: #302b4a; color: var(--text); border: none; border-radius: 999px;
    padding: 1.8cqh 3.3cqw; font-size: 1.95cqmin; font-weight: 700; cursor: pointer;
    font-family: 'Fredoka', sans-serif;
  }
  #end-game-btn.confirm-armed { background: #ff8a3d; color: #201827; }
  #new-room-btn {
    position: fixed; bottom: 2cqh; right: 2cqw; z-index: 500;
    background: var(--accent); color: #201827; border: none; border-radius: 999px;
    padding: 1.8cqh 3.3cqw; font-size: 1.95cqmin; font-weight: 700; cursor: pointer;
    font-family: 'Fredoka', sans-serif; display: none;
  }
  #new-room-btn.confirm-armed { background: #ff8a3d; color: #201827; }
  .tv-frame:has(#gameover-view:not(.hidden)) #new-room-btn { display: block; }
  #reconnect-btn {
    position: fixed; bottom: 2cqh; left: 2cqw; z-index: 500;
    background: #302b4a; color: var(--text); border: none; border-radius: 999px;
    padding: 1.8cqh 3.3cqw; font-size: 1.95cqmin; font-weight: 700; cursor: pointer;
    font-family: 'Fredoka', sans-serif;
  }
  #reconnect-btn.reconnecting { background: var(--accent-2); color: #fff; opacity: 1; cursor: default; }
  .tv-frame:has(#start-view:not(.hidden)) #reconnect-btn { display: none; }
  .tv-frame:has(#lobby-view:not(.hidden)) #end-game-btn,
  .tv-frame:has(#gameover-view:not(.hidden)) #end-game-btn,
  .tv-frame:has(#start-view:not(.hidden)) #end-game-btn { display: none; }
  #start-view {
    position: fixed; inset: 0; z-index: 900;
    background:
      radial-gradient(circle at 15% -10%, rgba(255,61,154,0.25), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(124,77,255,0.28), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(255,217,74,0.10), transparent 55%),
      var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #start-view.hidden { display: none; }
  #start-play-btn {
    width: auto; padding: 1.8cqh 5cqw; font-size: 2.8cqmin; margin-top: 3cqh;
    font-family: 'Fredoka', sans-serif; color: #fff;
    display: inline-flex; align-items: center; gap: 0.8cqw;
  }
  #start-play-btn svg { width: 1.6em; height: 1.6em; flex-shrink: 0; }
  .tv-frame:has(#lobby-view:not(.hidden)) .header-side { display: none; }
  .tv-frame.video-focus .header-row { margin-top: 0.4cqh; }
  .tv-frame.video-focus .logo-mark { font-size: 6cqmin; margin-bottom: 0.2cqh; }
  .tv-frame.video-focus h1 { font-size: 2.6cqmin; margin: 0 0 0.4cqh; }
  .tv-frame.video-focus.cover-showing h1 { font-size: 5.2cqmin; }
  .wrap {
    flex: 1; width: 100%; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; overflow: hidden;
    /* Keeps content clear of the fixed bottom-corner buttons (End Game/Create New Room,
       Refresh Connection) regardless of what's currently on screen, so nothing ever grows
       tall enough to visually collide with them. */
    padding-bottom: 9cqh;
  }
  .wrap:has(#game-view:not(.hidden):not(.focus-mode)) { justify-content: flex-start; padding-top: 0; }
  .wrap:has(#game-view.choosing-chrome) { justify-content: flex-start; padding-top: 0; }

  .logo-mark { font-size: 18cqmin; line-height: 1; margin-bottom: 0.8cqh; filter: drop-shadow(0 0 2.2cqmin rgba(255,61,154,0.4)); }
  /* Removed entirely (not just shrunk) while the song cards are on screen (voting) — freeing
     up vertical space so the cards don't collide with the fixed Refresh Connection/End Game
     buttons in the bottom corners. */
  .tv-frame:has(#game-view.choosing-chrome) .logo-mark,
  .tv-frame:has(#game-view.choosing-chrome) h1 { display: none; }
  h1 {
    font-family: 'Fredoka', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 10cqmin;
    margin: 0 0 1.5cqh;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg, #ff3d9a, #ffd94a 50%, #7c4dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 1.8cqmin rgba(255, 61, 154, 0.35));
  }
  @keyframes titlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  .tv-frame:has(#lobby-view:not(.hidden)) h1,
  .tv-frame:has(#gameover-view:not(.hidden)) h1,
  #start-view h1 {
    display: inline-block;
    animation: titlePulse 2.2s ease-in-out infinite;
  }
  .round-header { font-family: 'Fredoka', sans-serif; font-size: 2.7cqmin; font-weight: 600; color: var(--muted); margin-top: 20px; margin-bottom: 0.9cqh; }
  .lobby-top-row { display: flex; align-items: center; justify-content: center; gap: 5cqw; flex-wrap: wrap; }
  .code-box {
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    border-radius: 2cqmin; padding: 2.8cqh 4.5cqw; margin: 2.2cqh 0;
    box-shadow: 0 0 4.5cqmin rgba(255, 61, 154, 0.25), 0 0 0 1px rgba(255,255,255,0.08) inset;
  }
  .code-box .label { font-size: 1.5cqmin; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.9; font-weight: 600; }
  .code-box .code {
    font-family: 'Fredoka', sans-serif; font-size: 9.5cqmin; font-weight: 700;
    letter-spacing: 0.18em; margin-top: 0.6cqh; text-shadow: 0 0.3cqmin 0 rgba(0,0,0,0.15);
  }
  .code-box .hint { font-size: 1.6cqmin; opacity: 0.95; margin-top: 1cqh; }
  .lobby-qr-section #qrcode-lobby { display: inline-block; padding: 10px; background: #fff; border-radius: 1.2cqmin; line-height: 0; }
  .lobby-qr-unavailable { font-size: 1.1cqmin; color: var(--muted); max-width: 60cqw; margin: 1.2cqh auto; }
  .judge-banner {
    background: rgba(255, 217, 74, 0.14); border: 2px solid var(--gold); color: var(--gold);
    border-radius: 999px; display: inline-block; padding: 1.2cqh 3cqw; font-size: 2cqmin; font-weight: 700; margin-bottom: 1.8cqh;
  }
  .rounds-picker {
    display: flex; align-items: center; justify-content: center; gap: 1.5cqmin;
    margin: 2cqh 0 0.8cqh; font-size: 1.9cqmin; font-weight: 700; color: var(--muted);
  }
  .prompt-box {
    padding: 0.6cqh 200px; margin: 20px auto 2cqh;
    font-size: 4cqmin; font-weight: 700; max-width: 92cqw;
  }
  .prompt-box .prompt-label { display: block; font-size: 1.5cqmin; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.9cqh; }
  .players { display: flex; flex-wrap: wrap; gap: 1.4cqmin; justify-content: center; margin: 2cqh 0; max-height: 20cqh; overflow-y: auto; }
  .player-chip {
    background: var(--panel); border: 2px solid #3c3560; border-radius: 999px;
    padding: 1.2cqh 2.4cqw; font-size: 2cqmin; font-weight: 700; display: flex; align-items: center; gap: 0.9cqmin;
    min-width: 26cqw;
  }
  .player-chip .dot { width: 1cqmin; height: 1cqmin; border-radius: 50%; background: #5a5382; }
  .player-chip.picked { background: rgba(74, 222, 128, 0.18); border-color: #4ade80; }
  .player-chip.picked .dot { background: #4ade80; box-shadow: 0 0 0.9cqmin #4ade80; }
  .player-chip.audience { opacity: 0.75; }
  .player-chip.disconnected { opacity: 0.5; font-style: italic; }
  .remove-player-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1.4cqmin; padding: 0 0.3cqw; margin-left: auto; line-height: 1;
    display: flex; align-items: center; font-family: inherit; font-weight: inherit;
  }
  .remove-player-btn:hover { color: #ff8a9c; }
  button {
    border: none; border-radius: 1.5cqmin; padding: 1.9cqh 3cqw; font-weight: 700;
    font-size: 2.05cqmin; cursor: pointer; margin: 0.7cqmin;
  }
  .primary { background: var(--accent); color: #201827; box-shadow: 0 0.5cqh 2cqmin rgba(255,61,154,0.35); }
  .primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .status { color: var(--muted); font-size: 2cqmin; margin: 1.5cqh 0; min-height: 1.2em; }
  .error-text { color: #ff8a9c; font-size: 1.75cqmin; min-height: 1.2em; }

  .yt-video-wrap {
    position: relative; width: 68cqw; aspect-ratio: 16 / 9; margin: 1.5cqh auto;
    border-radius: 2cqmin; overflow: hidden; background: #000;
    box-shadow: 0 0 4.5cqmin rgba(0,0,0,0.5);
  }
  .yt-video-wrap.hidden { display: none; }
  .yt-video-wrap iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; }

  .seq-progress { color: var(--muted); font-size: 1.8cqmin; margin-bottom: 1cqh; font-weight: 600; }
  .seq-card { margin: 1cqh 0; }
  .seq-card img { width: 22cqmin; height: 22cqmin; border-radius: 2cqmin; object-fit: cover; box-shadow: 0 1cqmin 3cqmin rgba(0,0,0,0.4); }
  .seq-card img.cover-wide { width: 39cqmin; height: 22cqmin; border-radius: 1.6cqmin; }
  .seq-card .title { font-size: 2.5cqmin; font-weight: 700; margin-top: 1.5cqh; }
  .seq-card .artist { color: var(--muted); font-size: 1.9cqmin; margin-top: 0.4cqh; }

  #game-view.focus-mode .seq-card img { width: 45cqmin; height: 45cqmin; }
  #game-view.focus-mode .seq-card img.cover-wide { width: 53cqmin; height: 30cqmin; }
  #game-view.focus-mode .seq-card .title { font-size: 3.4cqmin; }
  #game-view.focus-mode .seq-card .artist { font-size: 2.5cqmin; }
  #game-view.focus-mode .seq-progress { font-size: 2.4cqmin; }

  #game-view.choosing-chrome .prompt-box { font-size: 4cqmin; padding: 0.4cqh 200px; margin: -60px auto 1.2cqh; max-width: 88cqw; }
  #game-view.choosing-chrome .prompt-box .prompt-label { font-size: 1.1cqmin; margin-bottom: 0.5cqh; }

  .reveal-list { display: flex; flex-direction: column; gap: 1.2cqh; text-align: left; margin-top: 2cqh; max-width: 72cqw; margin-left: auto; margin-right: auto; max-height: 55cqh; overflow-y: auto; }

  /* .reveal-list.two-col and .reveal-list.four-col below both have higher specificity (two
     classes) than .hidden (one class) — without this, a card list with 3+ submissions keeps
     displaying as a grid even with .hidden applied, regardless of declaration order. */
  .reveal-list.two-col.hidden, .reveal-list.four-col.hidden { display: none; }
  .reveal-list.two-col {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-flow: row;
    gap: 1.4cqh 1.8cqw;
    max-width: 95cqw;
    max-height: none;
    overflow: visible;
  }
  .reveal-list.two-col .reveal-card { padding: 1.6cqh 2.2cqw; gap: 1.6cqw; }
  .reveal-list.two-col .reveal-card img { width: 7.5cqmin; height: 7.5cqmin; }
  .reveal-list.two-col .reveal-card img.cover-wide { width: 13.3cqmin; height: 7.5cqmin; }
  .reveal-list.two-col .reveal-card .meta .title { font-size: 2cqmin; }
  .reveal-list.two-col .reveal-card .meta .artist { font-size: 1.75cqmin; }
  .reveal-list.two-col .reveal-card .meta .by { font-size: 1.6cqmin; }
  .reveal-list.two-col .winner-badge { font-size: 3.4cqmin; padding: 0.8cqh 1.5cqw; }
  .reveal-list.four-col {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-flow: row;
    gap: 1cqh 1.2cqw;
    max-width: 98cqw;
    max-height: none;
    overflow: visible;
  }
  .reveal-list.four-col .reveal-card { padding: 1cqh 1.4cqw; gap: 1cqw; }
  .reveal-list.four-col .reveal-card img { width: 6cqmin; height: 6cqmin; }
  .reveal-list.four-col .reveal-card img.cover-wide { width: 10.6cqmin; height: 6cqmin; }
  .reveal-list.four-col .reveal-card .meta .title { font-size: 1.5cqmin; }
  .reveal-list.four-col .reveal-card .meta .artist { font-size: 1.3cqmin; }
  .reveal-list.four-col .reveal-card .meta .by { font-size: 1.2cqmin; }
  .reveal-list.four-col .winner-badge { font-size: 2.4cqmin; padding: 0.5cqh 1cqw; }
  .reveal-card {
    display: flex; align-items: center; gap: 1.8cqw; background: var(--panel);
    border-radius: 1.8cqmin; padding: 1.5cqh 2.2cqw; border: 2px solid transparent;
  }
  .reveal-card.now-playing { border-color: var(--accent); box-shadow: 0 0 2.2cqmin rgba(255,61,154,0.3); }
  .reveal-card.winner { background: rgba(255, 217, 74, 0.18); border-color: var(--gold); box-shadow: 0 0 2.2cqmin rgba(255,217,74,0.35); }
  .reveal-card img { width: 7cqmin; height: 7cqmin; border-radius: 1.2cqmin; }
  .reveal-card img.cover-wide { width: 12.4cqmin; height: 7cqmin; object-fit: cover; }
  .reveal-card .meta { flex: 1; }
  .reveal-card .meta .title {
    font-weight: 700; font-size: 2cqmin;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  .reveal-card .meta .artist {
    color: var(--muted); font-size: 1.75cqmin;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  .reveal-card .meta .by { font-size: 1.55cqmin; color: var(--accent); margin-top: 0.4cqh; font-weight: 600; }
  .winner-badge {
    background: var(--gold); color: #201827; font-weight: 800; font-size: 3.4cqmin;
    padding: 0.9cqh 1.8cqw; border-radius: 999px; white-space: nowrap;
  }
  /* .wrap uses align-items: center, which shrink-wraps every child to its own content's
     natural width by default — without explicit width here, #gameover-view and
     #final-scoreboard never actually grow wide enough to give .score-row's max-width
     anywhere to expand into, no matter how large that max-width is set. */
  #gameover-view, #final-scoreboard { width: 100%; }
  .score-row {
    display: flex; justify-content: space-between; background: var(--panel);
    border-radius: 1.8cqmin; padding: 1.7cqh 2.7cqw; margin-bottom: 1.2cqh; font-weight: 600; font-size: 2.3cqmin;
    width: 100%; max-width: 85cqw; margin-left: auto; margin-right: auto; border: 2px solid transparent;
  }
  .score-row.winner { background: rgba(255, 217, 74, 0.18); border-color: var(--gold); box-shadow: 0 0 2.2cqmin rgba(255,217,74,0.35); }
  #final-scoreboard.two-col {
    display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-flow: row;
    gap: 0.8cqh 2cqw; max-width: 97cqw; margin: 0 auto;
  }
  /* The two-column layout (6+ players) resets each row's own max-width back to none, since
     width there is governed by the grid's column tracks instead — so widening .score-row
     above only affects the single-column case; the container's own max-width just above is
     what actually controls per-row width here. */
  #final-scoreboard.two-col .score-row { max-width: none; margin: 0; }
  h2 { font-family: 'Fredoka', sans-serif; font-size: 3.6cqmin; margin: 0.8cqh 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="tv-frame">
<div id="start-view">
  <div class="logo-mark">🎧</div>
  <h1>Queue It Up!</h1>
  <button class="primary" id="start-play-btn">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6 4 L20 12 L6 20 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    Play
  </button>
</div>
<div class="header-row">
  <div class="header-side">
    <div class="mini-code-label">Room Code</div>
    <div class="mini-code" id="room-code">····</div>
  </div>
  <div class="header-center">
    <div class="logo-mark">🎧</div>
    <h1>Queue It Up!</h1>
  </div>
  <div class="header-side">
    <div id="qrcode"></div>
    <div class="qr-unavailable hidden" id="qr-unavailable">No QR — use the code</div>
  </div>
</div>
<button id="end-game-btn">End Game</button>
<button id="new-room-btn">Create New Room</button>
<button id="reconnect-btn" title="If the screen seems stuck or out of sync, tap this to refresh the connection">↻ Refresh Connection</button>
<div class="wrap">
  <div id="lobby-view">
    <div class="lobby-top-row">
      <div class="code-box">
        <div class="label">Room code</div>
        <div class="code" id="room-code-lobby">····</div>
      </div>
      <div class="lobby-qr-section" id="lobby-qr-section">
        <div id="qrcode-lobby"></div>
      </div>
    </div>
    <div class="lobby-qr-unavailable hidden" id="lobby-qr-unavailable">
      Couldn't detect this computer's network address for a QR code — players can still join by typing the room code above at your game's URL.
    </div>
    <div class="players" id="lobby-players-list"></div>
    <div class="rounds-picker">
      <span>Rounds:</span> <strong id="rounds-display">5</strong>
    </div>
  </div>

  <div id="game-view" class="hidden">
    <div class="prompt-box" id="prompt-box">
      <span id="prompt-text"></span>
    </div>
    <div class="round-header" id="round-label"></div>
    <div class="judge-banner" id="judge-banner"></div>
    <div class="players" id="arena-players-list"></div>
    <div class="status" id="picking-status"></div>

    <div class="yt-video-wrap hidden" id="yt-video-wrap"><div id="yt-player-container"></div></div>

    <div id="sequential-view" class="hidden">
      <div class="seq-progress" id="seq-progress"></div>
      <div class="seq-card" id="seq-cover-card">
        <img id="seq-cover" src="" alt="" />
      </div>
      <div class="title" id="seq-title" style="font-size:2.5cqmin; font-weight:700;"></div>
      <div class="artist" id="seq-artist" style="color:var(--muted); font-size:1.9cqmin;"></div>
    </div>

    <div class="reveal-list hidden" id="reveal-list"></div>
  </div>

  <div id="gameover-view" class="hidden">
    <h2>🏆 Final Scores</h2>
    <div id="final-scoreboard"></div>
    <div class="status" id="gameover-hint">Waiting on host…</div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const audio = new Audio();
  audio.volume = 0.6;

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  document.getElementById('start-play-btn').addEventListener('click', () => {
    try { getAudioCtx(); } catch (e) {}

  function playTone(freq, startTime, duration, type, gainPeak) {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak == null ? 0.22 : gainPeak, startTime + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.03);
  }

  function playNoiseBurst(startTime, duration, filterFreq, gainPeak) {
    const ctx = getAudioCtx();
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq;
    filter.Q.value = 1.2;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start(startTime);
    noise.stop(startTime + duration + 0.02);
  }

  const sfxFiles = {

  let ytPlayer = null;
  let ytReady = false;
  let ytApiLoaded = false;

  function createYtPlayer(onReadyCallback) {
    ytReady = false;
    if (ytPlayer && typeof ytPlayer.destroy === 'function') {
      try { ytPlayer.destroy(); } catch (e) {}
    }
    const container = document.getElementById('yt-player-container');
    container.innerHTML = '';
    const freshDiv = document.createElement('div');
    freshDiv.id = 'yt-player-' + (++ytPlayerCounter);
    container.appendChild(freshDiv);

    ytPlayer = new YT.Player(freshDiv.id, {
      height: '315',
      width: '560',
      playerVars: { rel: 0 },
      events: {
        onReady: () => {
          ytReady = true;
          ytPlayer.setVolume(100);
          // The 560x315 above is just a required initial value for the constructor — CSS
          // then force-resizes the actual iframe box to fill .yt-video-wrap responsively.
          // But YouTube's own player positions its title/settings overlay based on the pixel
          // size it was told about here, not the CSS-overridden box size, so without this
          // explicit correction that overlay stays laid out for 560x315 while the visible
          // player is much larger — cropping or misplacing it relative to what's shown.
          syncYtPlayerSize();
          console.log('[YouTube] Player ready.');
          if (onReadyCallback) onReadyCallback();
        },
        onStateChange: handleYtStateChange,
        onError: (e) => console.error('[YouTube] Player error, code:', e.data)
      }
    });
  }

  function syncYtPlayerSize() {
    if (!ytReady || !ytPlayer || typeof ytPlayer.setSize !== 'function') return;
    const rect = ytVideoWrap.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
      ytPlayer.setSize(rect.width, rect.height);
    }
  }

  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
  (function loadYouTubeIframeApi() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();

  const ytVideoWrap = document.getElementById('yt-video-wrap');

  const roomCodeEl = document.getElementById('room-code');
  const roomCodeLobbyEl = document.getElementById('room-code-lobby');
  const lobbyPlayersListEl = document.getElementById('lobby-players-list');
  const lobbyView = document.getElementById('lobby-view');

  const gameView = document.getElementById('game-view');
  const roundLabelEl = document.getElementById('round-label');
  const judgeBannerEl = document.getElementById('judge-banner');
  const promptBoxEl = document.getElementById('prompt-box');
  const promptTextEl = document.getElementById('prompt-text');

  const pickingStatusEl = document.getElementById('picking-status');

  const seqProgress = document.getElementById('seq-progress');
  const seqCoverCard = document.getElementById('seq-cover-card');
  const seqCover = document.getElementById('seq-cover');
  const seqTitle = document.getElementById('seq-title');

  let currentPhase = 'lobby';
  let gameStarted = false;
  let revealPicks = [];
  let revealSubPhase = null;
  let currentRevealIndex = 0;

  const HOST_ROOM_KEY = 'queueItUp.hostRoomCode';
  function saveHostRoomCode(code) {
    try { localStorage.setItem(HOST_ROOM_KEY, code); } catch (e) {}
  }
  function loadHostRoomCode() {
    try { return localStorage.getItem(HOST_ROOM_KEY); } catch (e) { return null; }
  }

  function applyRoomCodeAndQr(res) {
    roomCodeEl.textContent = res.code;
    roomCodeLobbyEl.textContent = res.code;
    document.getElementById('qrcode').innerHTML = '';
    document.getElementById('qrcode-lobby').innerHTML = '';

    if (res.joinBaseUrl) {

      });
      new QRCode(document.getElementById('qrcode-lobby'), {

      });
    } else {
      document.getElementById('qrcode').classList.add('hidden');
      document.getElementById('qr-unavailable').classList.remove('hidden');
      document.getElementById('lobby-qr-section').classList.add('hidden');
      document.getElementById('lobby-qr-unavailable').classList.remove('hidden');
    }
  }

  function createFreshRoom() {
    socket.emit('host:create-room', {}, (res) => {
      if (!res.ok) return;
      saveHostRoomCode(res.code);
      applyRoomCodeAndQr(res);
      if (isManuallyReconnecting) {
        isManuallyReconnecting = false;
        reconnectBtn.classList.remove('reconnecting');
        reconnectBtn.textContent = '↻ Refresh Connection';
      }
    });
  }

  // Runs on every connection, not just the first one — this is the fix for the host screen
  // silently falling out of sync mid-game. Socket.io reconnects the underlying network
  // connection automatically after any brief drop (Wi-Fi hiccups on a shared party network
  // are common over a long session), but that reconnection gets a brand-new socket id with
  // no association to any room at all. Without re-running this, the host's new connection
  // would never rejoin the room's broadcast channel — explaining both symptoms at once: the
  // display silently stops updating (it's no longer receiving "someone picked/voted"
  // broadcasts), and it stops reacting to the controller (same reason, same channel).
  const reconnectBtn = document.getElementById('reconnect-btn');
  let isManuallyReconnecting = false;
  reconnectBtn.addEventListener('click', () => {
    if (isManuallyReconnecting) return;
    isManuallyReconnecting = true;
    reconnectBtn.classList.add('reconnecting');
    reconnectBtn.textContent = 'Reconnecting…';
    // Tearing down and re-establishing the connection from scratch is the fix for a "zombie"
    // connection (one the browser still thinks is fine but actually isn't) — cheaper than a
    // full page reload since it skips re-downloading assets and re-initializing the YouTube
    // player, but otherwise triggers the exact same resume-and-resync path below.
    socket.disconnect();
    socket.connect();
    // Fallback in case there's a genuine, longer-lasting outage and 'connect' never fires —
    // don't leave the button stuck saying "Reconnecting…" forever with no way to try again.
    setTimeout(() => {
      if (!isManuallyReconnecting) return;
      isManuallyReconnecting = false;
      reconnectBtn.classList.remove('reconnecting');
      reconnectBtn.textContent = '↻ Refresh Connection';
    }, 10000);
  });

  socket.on('connect', () => {
    const savedRoomCode = loadHostRoomCode();
    if (savedRoomCode) {
      socket.emit('host:resume-room', { code: savedRoomCode }, (res) => {
        if (res.ok) {
          applyRoomCodeAndQr(res);
        } else {
          createFreshRoom();
        }
        if (isManuallyReconnecting) {
          isManuallyReconnecting = false;
          reconnectBtn.classList.remove('reconnecting');
          reconnectBtn.textContent = '↻ Refresh Connection';
        }
      });
    } else {
      createFreshRoom();
    }
  });

  // Safety net alongside the normal push-based 'room:players-updated' broadcasts — actively
  // re-fetch the current player list on a short interval so the display self-corrects within
  // a few seconds if any single broadcast is ever missed, rather than staying stuck.
  setInterval(() => {
    socket.emit('host:request-players', {}, (res) => {
      if (!res || !res.ok) return;
      renderPlayerChips(lobbyPlayersListEl, res.players, false, true);
      renderPlayerChips(arenaPlayersListEl, res.players, true);

      // Same idea for the reveal/playback screen — if a "next song" or "everyone's voted"
      // broadcast is ever missed, this brings the display back in sync within a few seconds
      // instead of leaving it stuck on a stale song or an unfinished sequential walkthrough.
      // Deliberately does NOT touch what's actually playing (audio/video) — only which card
      // is shown — so this can't itself cause a song to restart or cut out.
      if (res.phase === 'reveal' && res.reveal) {
        const picksMismatch = revealPicks.length !== res.reveal.picks.length
          || JSON.stringify(revealPicks) !== JSON.stringify(res.reveal.picks);

        if (currentPhase !== 'reveal' || picksMismatch) {
          revealPicks = res.reveal.picks;
          revealSubPhase = res.reveal.subPhase;
          currentRevealIndex = res.reveal.revealIndex;
          currentPhase = 'reveal';
          pickingStatusEl.textContent = '';
          if (revealSubPhase === 'sequential') {
            showSequentialCard();
          } else {
            sequentialView.classList.add('hidden');
            roundLabelEl.classList.remove('hidden');
            judgeBannerEl.classList.remove('hidden');
            promptBoxEl.classList.remove('hidden');
            gameView.classList.add('choosing-chrome');
            renderFullRevealList();
          }
        } else if (revealSubPhase === 'sequential' && res.reveal.subPhase === 'sequential' && res.reveal.revealIndex !== currentRevealIndex) {
          currentRevealIndex = res.reveal.revealIndex;
          showSequentialCard();
        } else if (revealSubPhase !== 'choosing' && res.reveal.subPhase === 'choosing') {
          revealSubPhase = 'choosing';
          sequentialView.classList.add('hidden');
          stopAllPlayback();
          roundLabelEl.classList.remove('hidden');
          judgeBannerEl.classList.remove('hidden');
          promptBoxEl.classList.remove('hidden');
          gameView.classList.add('choosing-chrome');
          renderFullRevealList();
        }
      }
    });
  }, 3000);

  // Best-effort keep-alive so a long game session is less likely to hit Render's free-tier
  // spin-down (which silently wipes the room and, if it happens, means the host screen's
  // resume attempt will fail and fall back to creating a whole new room mid-game). This
  // can't guarantee the platform never spins the service down, but it removes the most
  // likely trigger for it during an otherwise-active session.
  setInterval(() => {
    fetch('/api/keepalive').catch(() => {});

  // Two-tap inline confirmation (no browser popup) for the one control that stays on this screen.
  let endGameArmed = false;
  let endGameResetTimer = null;
  const endGameBtn = document.getElementById('end-game-btn');
  endGameBtn.addEventListener('click', () => {
    if (!endGameArmed) {
      endGameArmed = true;
      endGameBtn.textContent = 'Tap again to confirm';
      endGameBtn.classList.add('confirm-armed');
      clearTimeout(endGameResetTimer);
      endGameResetTimer = setTimeout(resetEndGameBtn, 3000);
      return;
    }
    resetEndGameBtn();
    sendEndGame();
  });

  function sendEndGame() {
    let confirmed = false;
    socket.emit('host:end-game', {}, (res) => {
      confirmed = true;
      endGameBtn.textContent = 'End Game';
      // A response of ok:false means the command genuinely reached the server but the game
      // was already over or something else changed — no need to retry, the button just
      // silently does nothing further, matching the original behavior for that case.
    });
    // If the command never even reaches the server (a "zombie" connection — the browser
    // thinks it's fine but no packets are actually getting through), no ack ever comes back.
    // This used to silently do nothing for 3 full seconds before even attempting recovery,
    // with no visible feedback at all — easy to mistake for the button simply not working,
    // especially if someone gives up and manually hits "Refresh Connection" before this ever
    // kicks in. Shortened the wait and the button now visibly shows what's happening instead.
    setTimeout(() => {
      if (confirmed) return;
      endGameBtn.textContent = 'Reconnecting…';
      socket.disconnect();
      socket.connect();
      socket.once('connect', () => {
        setTimeout(() => {
          socket.emit('host:end-game', {}, () => {
            endGameBtn.textContent = 'End Game';
          });
        }, 500);
      });
    }, 1500);
  }

  function resetEndGameBtn() {
    endGameArmed = false;
    clearTimeout(endGameResetTimer);
    endGameBtn.textContent = 'End Game';
    endGameBtn.classList.remove('confirm-armed');
  }

  // Same two-tap confirm pattern — this is destructive (leaves any still-connected players

  let newRoomArmed = false;
  let newRoomResetTimer = null;
  const newRoomBtn = document.getElementById('new-room-btn');
  newRoomBtn.addEventListener('click', () => {
    if (!newRoomArmed) {
      newRoomArmed = true;
      newRoomBtn.textContent = 'Tap again to confirm';
      newRoomBtn.classList.add('confirm-armed');
      clearTimeout(newRoomResetTimer);
      newRoomResetTimer = setTimeout(resetNewRoomBtn, 3000);

  socket.on('room:host-created-new-room', ({ code, joinBaseUrl }) => {
    gameStarted = false;
    startBgMusic();
    gameView.classList.add('hidden');
    gameoverView.classList.add('hidden');

  // Start/Play Again/Back to Lobby are all controller-driven now (from a player's phone) —
  // this screen just reacts to whatever the controller does, same as everything else.
  socket.on('room:rejoin-new-room', ({ code }) => {
    // Update the display AND actually tell the server to associate this socket with the new
    // room (join its channel, update tracking) — reusing the same resume flow already built
    // for host reconnection. Without this, the host's connection stays silently tied to the
    // just-deleted old room and never receives anything broadcast to the new one, including
    // "Start game" — exactly what was happening before this fix.
    socket.emit('host:resume-room', { code }, (res) => {
      if (!res.ok) return;
      gameStarted = false;
      startBgMusic();
      gameView.classList.add('hidden');
      gameoverView.classList.add('hidden');
      lobbyView.classList.remove('hidden');
      saveHostRoomCode(res.code);
      applyRoomCodeAndQr(res);
      renderPlayerChips(lobbyPlayersListEl, [], false, true);
    });
  });

  function renderPlayerChips(container, players, showScore, showRemoveBtn) {
    container.innerHTML = '';
    if (!players.length) {
      container.innerHTML = '<span style="color:var(--muted)">Waiting for players to join…</span>';
      return;
    }
    // Audience members are consolidated into a single counter chip rather than one chip
    // each — a room could have quite a few of them, and individually they don't need to be
    // distinguished the way active players (who actually submit/vote) do.
    const nonAudience = players.filter(p => p.role !== 'audience');
    const audienceCount = players.length - nonAudience.length;

    nonAudience.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'player-chip'
        + (p.hasPicked || p.hasVoted ? ' picked' : '')
        + (p.connected === false ? ' disconnected' : '');
      const label = escapeHtml(p.name) + (showScore ? ` · ${p.score} pts` : '') + (p.connected === false ? ' (reconnecting…)' : '');
      const removeBtn = showRemoveBtn ? `<button class="remove-player-btn" data-player-id="${p.id}" title="Remove ${escapeHtml(p.name)}">✕</button>` : '';
      chip.innerHTML = `<span class="dot"></span> ${label}${removeBtn}`;
      container.appendChild(chip);
    });

    if (audienceCount > 0 && !(container === arenaPlayersListEl && currentPhase === 'picking')) {
      // No green/gray progress indicator at all for the audience chip anymore — it's purely
      // a headcount, not a status. And during picking specifically it's hidden entirely on
      // the arena screen, since the audience has nothing to do at that point and the chip
      // added nothing but clutter there.
      const audienceChip = document.createElement('div');
      audienceChip.className = 'player-chip audience';
      const removeBtn = showRemoveBtn ? `<button class="remove-player-btn" data-remove-all-audience="true" title="Remove all audience members">✕</button>` : '';
      audienceChip.innerHTML = `<span class="dot"></span> Audience Members: ${audienceCount}${removeBtn}`;
      container.appendChild(audienceChip);
    }

    if (showRemoveBtn) {
      container.querySelectorAll('.remove-player-btn[data-player-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          socket.emit('controller:remove-player', { playerId: btn.dataset.playerId });
        });
      });
      const removeAllAudienceBtn = container.querySelector('.remove-player-btn[data-remove-all-audience]');
      if (removeAllAudienceBtn) {
        removeAllAudienceBtn.addEventListener('click', () => {
          socket.emit('controller:remove-all-audience');
        });
      }
    }
  }

  socket.on('room:players-updated', (players) => {
    renderPlayerChips(lobbyPlayersListEl, players, false, true);
    renderPlayerChips(arenaPlayersListEl, players, true);

    // "(name) is host" needs to stay accurate even when control changes hands mid-round —

    if (gameStarted && currentPhase !== 'lobby') {
      const controller = players.find(p => p.isController);
      if (controller) judgeBannerEl.textContent = `${controller.name} is host`;
    }

    if (gameStarted && currentPhase === 'picking') {
      const active = players.filter(p => p.role === 'active');
      const pickedCount = active.filter(p => p.hasPicked).length;
      pickingStatusEl.textContent = !active.length
        ? ''
        : pickedCount === active.length
          ? 'All players in'
          : `${pickedCount}/${active.length} players have picked…`;

    if (currentPhase === 'reveal' && revealSubPhase === 'choosing') {
      const activePlayers = players.filter(p => p.connected !== false && p.role === 'active');
      const votedCount = activePlayers.filter(p => p.hasVoted).length;
      pickingStatusEl.textContent = !activePlayers.length
        ? ''
        : votedCount === activePlayers.length
          ? 'All players in'
          : `${votedCount}/${activePlayers.length} have voted…`;
    }
  });

  socket.on('room:player-joined', () => {

  });

  socket.on('room:pick-submitted', () => {

  });

  socket.on('room:all-picked', () => {
    sfx.allPicked();
  });

  socket.on('room:rounds-selected', ({ totalRounds }) => {
    document.getElementById('rounds-display').textContent = totalRounds;
  });

  socket.on('room:round-started', ({ roundNumber, totalRounds, prompt, controllerName }) => {
    gameStarted = true;
    currentPhase = 'picking';
    lobbyView.classList.add('hidden');
    gameoverView.classList.add('hidden');
    gameView.classList.remove('hidden');
    exitSequentialFocus();
    // Move the status text back to its original spot (right after the player chips) — during
    // voting it gets relocated to sit under the song cards instead.
    arenaPlayersListEl.insertAdjacentElement('afterend', pickingStatusEl);
    roundLabelEl.textContent = `Round ${roundNumber} of ${totalRounds}`;
    judgeBannerEl.textContent = `${controllerName} is host`;
    promptTextEl.textContent = prompt;
    sequentialView.classList.add('hidden');
    revealListEl.classList.add('hidden');
    revealListEl.innerHTML = '';
    pickingStatusEl.textContent = '';
    stopAllPlayback();
    startBgMusic();
  });

  socket.on('room:next-round-sound', () => {
    sfx.nextRound();
  });

  socket.on('room:play-again-sound', () => {
    sfx.playAgain();
  });

  socket.on('room:prompt-changed', ({ prompt }) => {
    promptTextEl.textContent = prompt;
    sfx.shuffle();
  });

  socket.on('room:reveal', ({ picks, revealIndex, subPhase }) => {
    currentPhase = 'reveal';
    pickingStatusEl.textContent = '';
    stopBgMusic();
    revealPicks = picks;
    revealSubPhase = subPhase;
    currentRevealIndex = revealIndex;
    showSequentialCard();
    sfx.revealPicks();
  });

  socket.on('room:reveal-advanced', ({ revealIndex }) => {
    currentRevealIndex = revealIndex;
    showSequentialCard();
  });

  const tvFrameEl = document.querySelector('.tv-frame');
  function enterSequentialFocus() {
    roundLabelEl.classList.add('hidden');
    judgeBannerEl.classList.add('hidden');
    promptBoxEl.classList.add('hidden');
    arenaPlayersListEl.classList.add('hidden');
    pickingStatusEl.classList.add('hidden');
    gameView.classList.add('focus-mode');
    gameView.classList.remove('choosing-chrome');
    tvFrameEl.classList.add('video-focus');
  }
  function exitSequentialFocus() {
    roundLabelEl.classList.remove('hidden');
    judgeBannerEl.classList.remove('hidden');
    promptBoxEl.classList.remove('hidden');
    arenaPlayersListEl.classList.remove('hidden');
    pickingStatusEl.classList.remove('hidden');
    gameView.classList.remove('focus-mode');
    gameView.classList.remove('choosing-chrome');
    tvFrameEl.classList.remove('video-focus');
    tvFrameEl.classList.remove('cover-showing');
  }

  function showSequentialCard() {
    revealListEl.classList.add('hidden');
    sequentialView.classList.remove('hidden');
    enterSequentialFocus();
    ytVideoWrap.classList.add('hidden');
    seqCoverCard.classList.remove('hidden');

    const entry = revealPicks[currentRevealIndex];
    if (!entry) return;
    seqProgress.textContent = `Song ${currentRevealIndex + 1} of ${revealPicks.length}`;
    seqCover.src = entry.track.cover;
    seqCover.classList.toggle('cover-wide', !!entry.track.youtube);
    seqTitle.innerHTML = escapeHtml(entry.track.title);
    seqArtist.textContent = entry.track.artist;
    tvFrameEl.classList.add('cover-showing');
  }

  socket.on('room:reveal-choosing', () => {
    revealSubPhase = 'choosing';
    sequentialView.classList.add('hidden');
    stopAllPlayback();
    roundLabelEl.classList.remove('hidden');
    judgeBannerEl.classList.remove('hidden');
    promptBoxEl.classList.remove('hidden');
    // Keeping the vote counter text visible, but not the full chip row — too cluttered
    // alongside the song cards. Move it to sit under those cards instead of its picking-phase
    // spot right after the player chips, matching where it visually belongs during voting.
    pickingStatusEl.classList.remove('hidden');
    gameView.classList.add('choosing-chrome');
    renderFullRevealList();
    revealListEl.insertAdjacentElement('afterend', pickingStatusEl);
  });

  function renderFullRevealList() {
    revealListEl.classList.remove('hidden');
    const count = revealPicks.length;
    revealListEl.classList.toggle('two-col', count >= 3 && count < 5);
    revealListEl.classList.toggle('four-col', count >= 5);
    revealListEl.innerHTML = '';
    revealPicks.forEach((entry, i) => {
      const card = document.createElement('div');
      card.className = 'reveal-card';
      card.dataset.index = i;
      card.innerHTML = `
        <img src="${entry.track.cover}" alt="" class="${entry.track.youtube ? 'cover-wide' : ''}" />
        <div class="meta">
          <div class="title">${escapeHtml(entry.track.title)}</div>
          <div class="artist">${escapeHtml(entry.track.artist)}</div>
          <div class="by hidden">Picked by ${escapeHtml(entry.playerName)}</div>
        </div>
      `;
      revealListEl.appendChild(card);
    });
  }

  socket.on('room:now-playing', ({ index, track }) => {
    document.querySelectorAll('.reveal-card').forEach(c => c.classList.remove('now-playing'));
    const card = revealListEl.querySelector(`.reveal-card[data-index="${index}"]`);
    if (card) card.classList.add('now-playing');

    if (track.youtube && ytApiLoaded) {
      audio.pause();
      seqCoverCard.classList.add('hidden');
      ytVideoWrap.classList.remove('hidden');
      tvFrameEl.classList.remove('cover-showing');
      // The prompt box otherwise stays visible during voting (choosing-chrome), leaving too
      // little vertical space for the video and clipping it at the bottom — hide it whenever
      // a YouTube video is actually playing, regardless of which phase triggered it.
      promptBoxEl.classList.add('hidden');
      // video-focus (which shrinks the header's room code/QR/title) was only ever being
      // applied during the sequential walkthrough — but a YouTube video can also play during
      // voting (replaying a song from the vote list), where the header was staying full-size
      // the whole time and eating into the same space the video needed, cropping it too.
      tvFrameEl.classList.add('video-focus');
      // During voting specifically, give it the exact same full-screen presentation as the
      // sequential walkthrough — also hiding the song cards, round tracker, and host banner.
      // Not reusing enterSequentialFocus() itself since that also strips the choosing-chrome
      // class, which would break restoring the voting layout once playback stops.
      if (gameView.classList.contains('choosing-chrome')) {
        revealListEl.classList.add('hidden');
        roundLabelEl.classList.add('hidden');
        judgeBannerEl.classList.add('hidden');
        gameView.classList.add('focus-mode');
      }
      const videoId = track.youtube.videoId;
      const startSeconds = track.youtube.startSeconds || 0;
      createYtPlayer(() => {
        ytPlayer.loadVideoById({ videoId, startSeconds });
        ytPlayer.playVideo();
        // The container's actual size can differ between plays (e.g. hiding the prompt box
        // above it changes available space), so re-sync every time rather than relying on
        // whatever was measured when the player was first created. A second, delayed sync
        // catches any layout that hadn't fully settled yet at the moment of the first one
        // (e.g. if hiding/showing other elements around it triggers a reflow slightly later).
        syncYtPlayerSize();
        setTimeout(syncYtPlayerSize, 300);
      });
    } else {
      if (ytReady) ytPlayer.stopVideo();
      ytVideoWrap.classList.add('hidden');
      seqCoverCard.classList.remove('hidden');
      tvFrameEl.classList.add('cover-showing');
      audio.src = track.previewUrl;
      audio.play();
    }
  });

  socket.on('room:stop-playback', () => {
    stopAllPlayback();
  });

  function stopAllPlayback() {
    audio.pause();
    if (ytReady) ytPlayer.pauseVideo();
    ytVideoWrap.classList.add('hidden');
    seqCoverCard.classList.remove('hidden');
    document.querySelectorAll('.reveal-card').forEach(c => c.classList.remove('now-playing'));
    // Only re-show the prompt (and un-shrink the header) if we're actually in the voting
    // layout, where both are normally visible/full-size — during the sequential song-by-song
    // walkthrough they're meant to stay hidden/shrunk regardless (that's managed separately
    // by enter/exitSequentialFocus, which this shouldn't fight with).
    if (gameView.classList.contains('choosing-chrome')) {
      promptBoxEl.classList.remove('hidden');
      tvFrameEl.classList.remove('video-focus');
      revealListEl.classList.remove('hidden');
      roundLabelEl.classList.remove('hidden');
      judgeBannerEl.classList.remove('hidden');
      gameView.classList.remove('focus-mode');
    }
  }

  audio.addEventListener('ended', () => {
    socket.emit('host:playback-ended');
  });

  // Every song that got at least one vote turns gold and shows its tally — replacing the
  // old single-winner badge, since points are now earned per vote rather than one crowned pick.
  socket.on('room:results-revealed', ({ voteCounts }) => {
    revealPicks.forEach((entry, i) => {
      const count = voteCounts[i] || 0;
      const card = revealListEl.querySelector(`.reveal-card[data-index="${i}"]`);
      if (!card) return;
      if (count > 0) card.classList.add('winner');
      const tag = document.createElement('span');
      tag.className = 'winner-badge';
      tag.textContent = `${count} vote${count === 1 ? '' : 's'}`;
      card.appendChild(tag);
    });
    revealListEl.querySelectorAll('.by').forEach(el => el.classList.remove('hidden'));
    sfx.winnerChosen();
  });

  socket.on('room:game-over', ({ scoreboard }) => {
    stopAllPlayback();
    startBgMusic();
    exitSequentialFocus();
    gameView.classList.add('hidden');
    gameoverView.classList.remove('hidden');
    sfx.nextRound();
    finalScoreboardEl.innerHTML = '';
    finalScoreboardEl.classList.toggle('two-col', scoreboard.length > 5);
    scoreboard.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'score-row' + (i === 0 ? ' winner' : '');
      row.innerHTML = `<span>${i + 1}. ${escapeHtml(p.name)}</span><span>${p.score} pts</span>`;
      finalScoreboardEl.appendChild(row);
    });
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
